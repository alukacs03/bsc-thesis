---
- name: Deploy Grafana
  hosts: "{{ monitor_host | default('api') }}"
  become: yes
  vars:
    grafana_version: "11.1.0"

  tasks:
    - name: Install dependencies
      apt:
        name:
          - adduser
          - libfontconfig1
          - musl
        state: present
        update_cache: yes

    - name: Check if Grafana is installed
      stat:
        path: /usr/sbin/grafana-server
      register: grafana_binary

    - name: Download Grafana deb
      get_url:
        url: "https://dl.grafana.com/oss/release/grafana_{{ grafana_version }}_amd64.deb"
        dest: /tmp/grafana.deb
        mode: "0644"
      when: not grafana_binary.stat.exists

    - name: Install Grafana
      apt:
        deb: /tmp/grafana.deb
      when: not grafana_binary.stat.exists
      notify: Restart Grafana

    - name: Create provisioning directories
      file:
        path: "{{ item }}"
        state: directory
        owner: grafana
        group: grafana
        mode: "0755"
      loop:
        - /etc/grafana/provisioning/datasources
        - /etc/grafana/provisioning/dashboards
        - /var/lib/grafana/dashboards

    - name: Provision Prometheus datasource
      copy:
        dest: /etc/grafana/provisioning/datasources/prometheus.yaml
        owner: grafana
        group: grafana
        mode: "0644"
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://localhost:9090
              isDefault: true
              editable: true
      notify: Restart Grafana

    - name: Provision Loki datasource
      copy:
        src: ../monitoring/grafana/datasources/loki.yaml
        dest: /etc/grafana/provisioning/datasources/loki.yaml
        owner: grafana
        group: grafana
        mode: "0644"
      notify: Restart Grafana

    - name: Provision dashboard loader
      copy:
        dest: /etc/grafana/provisioning/dashboards/gluon.yaml
        owner: grafana
        group: grafana
        mode: "0644"
        content: |
          apiVersion: 1
          providers:
            - name: Gluon
              type: file
              options:
                path: /var/lib/grafana/dashboards
                foldersFromFilesStructure: false
      notify: Restart Grafana

    - name: Copy dashboard JSON files
      copy:
        src: "{{ item }}"
        dest: /var/lib/grafana/dashboards/
        owner: grafana
        group: grafana
        mode: "0644"
      with_fileglob:
        - ../monitoring/dashboards/*.json
      notify: Restart Grafana

    - name: Enable and start Grafana
      systemd:
        name: grafana-server
        enabled: yes
        state: started

    - name: Clean up
      file:
        path: /tmp/grafana.deb
        state: absent

  handlers:
    - name: Restart Grafana
      systemd:
        name: grafana-server
        state: restarted
