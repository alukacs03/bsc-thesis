---
# Deploy Promtail to all Gluon agent nodes
# Usage: ansible-playbook -i inventory.yaml deploy-promtail.yml -e "loki_host=192.168.1.X"

- name: Deploy Promtail
  hosts: agents
  become: yes
  vars:
    promtail_version: "3.0.0"
    promtail_user: promtail
    promtail_group: promtail
    promtail_config_dir: /etc/promtail
    promtail_data_dir: /var/lib/promtail
    loki_host: "{{ loki_host | default('monitor') }}"

  tasks:
    - name: Create promtail user
      user:
        name: "{{ promtail_user }}"
        system: yes
        shell: /usr/sbin/nologin
        groups:
          - adm      # For reading /var/log files
          - systemd-journal  # For reading journal
        append: yes

    - name: Create directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ promtail_user }}"
        group: "{{ promtail_group }}"
        mode: "0755"
      loop:
        - "{{ promtail_config_dir }}"
        - "{{ promtail_data_dir }}"

    - name: Check if Promtail binary exists
      stat:
        path: /usr/local/bin/promtail
      register: promtail_binary

    - name: Download Promtail binary
      get_url:
        url: "https://github.com/grafana/loki/releases/download/v{{ promtail_version }}/promtail-linux-amd64.zip"
        dest: /tmp/promtail.zip
        mode: "0644"
      when: not promtail_binary.stat.exists

    - name: Install unzip
      apt:
        name: unzip
        state: present
      when: not promtail_binary.stat.exists

    - name: Extract Promtail binary
      unarchive:
        src: /tmp/promtail.zip
        dest: /tmp/
        remote_src: yes
      when: not promtail_binary.stat.exists

    - name: Install Promtail binary
      copy:
        src: /tmp/promtail-linux-amd64
        dest: /usr/local/bin/promtail
        remote_src: yes
        owner: root
        group: root
        mode: "0755"
      when: not promtail_binary.stat.exists
      notify: Restart Promtail

    - name: Copy Promtail configuration
      template:
        src: ../monitoring/promtail/promtail-config.yaml
        dest: "{{ promtail_config_dir }}/promtail-config.yaml"
        owner: "{{ promtail_user }}"
        group: "{{ promtail_group }}"
        mode: "0644"
      notify: Restart Promtail

    - name: Replace LOKI_HOST in config
      replace:
        path: "{{ promtail_config_dir }}/promtail-config.yaml"
        regexp: '\$\{LOKI_HOST\}'
        replace: "{{ loki_host }}"

    - name: Replace HOSTNAME in config
      replace:
        path: "{{ promtail_config_dir }}/promtail-config.yaml"
        regexp: '\$\{HOSTNAME\}'
        replace: "{{ inventory_hostname }}"

    - name: Create Promtail systemd service
      copy:
        dest: /etc/systemd/system/promtail.service
        content: |
          [Unit]
          Description=Promtail log shipping agent
          Documentation=https://grafana.com/docs/loki/latest/clients/promtail/
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User={{ promtail_user }}
          Group={{ promtail_group }}
          ExecStart=/usr/local/bin/promtail -config.file={{ promtail_config_dir }}/promtail-config.yaml
          ExecReload=/bin/kill -HUP $MAINPID
          Restart=on-failure
          RestartSec=5

          # For reading systemd journal
          CapabilityBoundingSet=CAP_DAC_READ_SEARCH
          AmbientCapabilities=CAP_DAC_READ_SEARCH

          # For reading /var/log/pods (containerd logs)
          ReadOnlyPaths=/var/log

          [Install]
          WantedBy=multi-user.target
        mode: "0644"
      notify:
        - Reload systemd
        - Restart Promtail

    - name: Enable and start Promtail
      systemd:
        name: promtail
        enabled: yes
        state: started

    - name: Clean up downloaded files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/promtail.zip
        - /tmp/promtail-linux-amd64

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart Promtail
      systemd:
        name: promtail
        state: restarted
