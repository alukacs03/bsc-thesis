server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://${LOKI_HOST}:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576  # 1MB
    timeout: 10s

scrape_configs:
  # Gluon Agent logs
  - job_name: gluon-agent
    static_configs:
      - targets:
          - localhost
        labels:
          job: gluon-agent
          host: ${HOSTNAME}
          __path__: /var/log/gluon-agent.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            time: time
            component: component
      - labels:
          level:
          component:
      - timestamp:
          source: time
          format: RFC3339Nano

  # Gluon Agent systemd journal
  - job_name: gluon-agent-journal
    journal:
      json: false
      max_age: 12h
      labels:
        job: gluon-agent-journal
        host: ${HOSTNAME}
      path: /var/log/journal
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: 'unit'
      - source_labels: ['__journal__systemd_unit']
        regex: 'gluon-agent.service'
        action: keep
    pipeline_stages:
      - regex:
          expression: 'level=(?P<level>\w+)'
      - labels:
          level:

  # WireGuard logs (from dmesg/journal)
  - job_name: wireguard
    journal:
      json: false
      max_age: 12h
      labels:
        job: wireguard
        host: ${HOSTNAME}
      path: /var/log/journal
    relabel_configs:
      - source_labels: ['__journal__transport']
        regex: 'kernel'
        action: keep
    pipeline_stages:
      - match:
          selector: '{job="wireguard"}'
          stages:
            - regex:
                expression: 'wireguard.*'
            - drop:
                expression: '.*'
                older_than: 0s
                drop_counter_reason: not_wireguard_log

  # FRR/OSPF logs
  - job_name: frr
    static_configs:
      - targets:
          - localhost
        labels:
          job: frr
          host: ${HOSTNAME}
          __path__: /var/log/frr/*.log
    pipeline_stages:
      - regex:
          expression: '(?P<timestamp>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) (?P<daemon>\w+): (?P<level>\w+): (?P<message>.*)'
      - labels:
          daemon:
          level:
      - timestamp:
          source: timestamp
          format: '2006/01/02 15:04:05'

  # System logs (syslog)
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          host: ${HOSTNAME}
          __path__: /var/log/syslog
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\w{3}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?P<host>\S+)\s+(?P<program>[^\[:\s]+)(?:\[(?P<pid>\d+)\])?:\s+(?P<message>.*)$'
      - labels:
          program:

  # Kubernetes kubelet logs (if running K8s)
  - job_name: kubelet
    journal:
      json: false
      max_age: 12h
      labels:
        job: kubelet
        host: ${HOSTNAME}
      path: /var/log/journal
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        regex: 'kubelet.service'
        action: keep
    pipeline_stages:
      - regex:
          expression: '(?P<level>[IWEF])\d{4}\s+\d{2}:\d{2}:\d{2}\.\d+\s+\d+\s+(?P<file>\S+):(?P<line>\d+)\]\s+(?P<message>.*)'
      - labels:
          level:

  # Kubernetes container logs (containerd)
  - job_name: kubernetes-pods
    static_configs:
      - targets:
          - localhost
        labels:
          job: kubernetes-pods
          host: ${HOSTNAME}
          __path__: /var/log/pods/*/*/*.log
    pipeline_stages:
      - cri: {}
      - labeldrop:
          - filename
