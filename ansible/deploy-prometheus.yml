---
- name: Deploy Prometheus
  hosts: "{{ monitor_host | default('api') }}"
  become: yes
  vars:
    prom_version: "2.53.0"
    prom_user: prometheus
    prom_group: prometheus
    prom_data_dir: /var/lib/prometheus
    prom_config_dir: /etc/prometheus

  tasks:
    - name: Create prometheus user
      user:
        name: "{{ prom_user }}"
        system: yes
        shell: /usr/sbin/nologin
        home: "{{ prom_data_dir }}"
        create_home: no

    - name: Create directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ prom_user }}"
        group: "{{ prom_group }}"
        mode: "0755"
      loop:
        - "{{ prom_config_dir }}"
        - "{{ prom_config_dir }}/rules"
        - "{{ prom_data_dir }}"

    - name: Check if Prometheus binary exists
      stat:
        path: /usr/local/bin/prometheus
      register: prom_binary

    - name: Download Prometheus
      get_url:
        url: "https://github.com/prometheus/prometheus/releases/download/v{{ prom_version }}/prometheus-{{ prom_version }}.linux-amd64.tar.gz"
        dest: /tmp/prometheus.tar.gz
        mode: "0644"
      when: not prom_binary.stat.exists

    - name: Extract Prometheus
      unarchive:
        src: /tmp/prometheus.tar.gz
        dest: /tmp/
        remote_src: yes
      when: not prom_binary.stat.exists

    - name: Install Prometheus binaries
      copy:
        src: "/tmp/prometheus-{{ prom_version }}.linux-amd64/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        remote_src: yes
        owner: root
        group: root
        mode: "0755"
      loop:
        - prometheus
        - promtool
      when: not prom_binary.stat.exists
      notify: Restart Prometheus

    - name: Write Prometheus configuration
      copy:
        dest: "{{ prom_config_dir }}/prometheus.yml"
        owner: "{{ prom_user }}"
        group: "{{ prom_group }}"
        mode: "0644"
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s

          alerting:
            alertmanagers:
              - static_configs:
                  - targets:
                      - localhost:9093

          rule_files:
            - /etc/prometheus/rules/*.yml

          scrape_configs:
            - job_name: 'gluon-api'
              static_configs:
                - targets: ['localhost:3000']
              metrics_path: /metrics
              scheme: https
              tls_config:
                insecure_skip_verify: true
      notify: Restart Prometheus

    - name: Copy alert rules
      copy:
        src: ../monitoring/alerts/gluon.yml
        dest: "{{ prom_config_dir }}/rules/gluon.yml"
        owner: "{{ prom_user }}"
        group: "{{ prom_group }}"
        mode: "0644"
      notify: Restart Prometheus

    - name: Create Prometheus systemd service
      copy:
        dest: /etc/systemd/system/prometheus.service
        content: |
          [Unit]
          Description=Prometheus monitoring system
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User={{ prom_user }}
          Group={{ prom_group }}
          ExecStart=/usr/local/bin/prometheus \
            --config.file={{ prom_config_dir }}/prometheus.yml \
            --storage.tsdb.path={{ prom_data_dir }} \
            --storage.tsdb.retention.time=14d \
            --web.listen-address=:9090
          ExecReload=/bin/kill -HUP $MAINPID
          Restart=on-failure
          RestartSec=5
          LimitNOFILE=65536

          ProtectSystem=full
          ProtectHome=true
          NoNewPrivileges=true

          [Install]
          WantedBy=multi-user.target
        mode: "0644"
      notify:
        - Reload systemd
        - Restart Prometheus

    - name: Enable and start Prometheus
      systemd:
        name: prometheus
        enabled: yes
        state: started

    - name: Clean up
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/prometheus.tar.gz
        - "/tmp/prometheus-{{ prom_version }}.linux-amd64"

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart Prometheus
      systemd:
        name: prometheus
        state: restarted
