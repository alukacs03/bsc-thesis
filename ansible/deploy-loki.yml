---
# Deploy Loki to the monitoring server
# Usage: ansible-playbook -i inventory.yaml deploy-loki.yml -e "monitor_host=monitor"

- name: Deploy Loki
  hosts: "{{ monitor_host | default('monitor') }}"
  become: yes
  vars:
    loki_version: "3.0.0"
    loki_user: loki
    loki_group: loki
    loki_data_dir: /var/lib/loki
    loki_config_dir: /etc/loki

  tasks:
    - name: Create loki user
      user:
        name: "{{ loki_user }}"
        system: yes
        shell: /usr/sbin/nologin
        home: "{{ loki_data_dir }}"
        create_home: no

    - name: Create directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ loki_user }}"
        group: "{{ loki_group }}"
        mode: "0755"
      loop:
        - "{{ loki_config_dir }}"
        - "{{ loki_data_dir }}"
        - "{{ loki_data_dir }}/chunks"
        - "{{ loki_data_dir }}/rules"
        - "{{ loki_data_dir }}/compactor"

    - name: Check if Loki binary exists
      stat:
        path: /usr/local/bin/loki
      register: loki_binary

    - name: Download Loki binary
      get_url:
        url: "https://github.com/grafana/loki/releases/download/v{{ loki_version }}/loki-linux-amd64.zip"
        dest: /tmp/loki.zip
        mode: "0644"
      when: not loki_binary.stat.exists

    - name: Install unzip
      apt:
        name: unzip
        state: present
      when: not loki_binary.stat.exists

    - name: Extract Loki binary
      unarchive:
        src: /tmp/loki.zip
        dest: /tmp/
        remote_src: yes
      when: not loki_binary.stat.exists

    - name: Install Loki binary
      copy:
        src: /tmp/loki-linux-amd64
        dest: /usr/local/bin/loki
        remote_src: yes
        owner: root
        group: root
        mode: "0755"
      when: not loki_binary.stat.exists
      notify: Restart Loki

    - name: Copy Loki configuration
      copy:
        src: ../monitoring/loki/loki-config.yaml
        dest: "{{ loki_config_dir }}/loki-config.yaml"
        owner: "{{ loki_user }}"
        group: "{{ loki_group }}"
        mode: "0644"
      notify: Restart Loki

    - name: Create Loki systemd service
      copy:
        dest: /etc/systemd/system/loki.service
        content: |
          [Unit]
          Description=Loki log aggregation system
          Documentation=https://grafana.com/docs/loki/latest/
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User={{ loki_user }}
          Group={{ loki_group }}
          ExecStart=/usr/local/bin/loki -config.file={{ loki_config_dir }}/loki-config.yaml
          ExecReload=/bin/kill -HUP $MAINPID
          Restart=on-failure
          RestartSec=5
          LimitNOFILE=65536

          # Hardening
          ProtectSystem=full
          ProtectHome=true
          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
        mode: "0644"
      notify:
        - Reload systemd
        - Restart Loki

    - name: Enable and start Loki
      systemd:
        name: loki
        enabled: yes
        state: started

    - name: Clean up downloaded files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/loki.zip
        - /tmp/loki-linux-amd64

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart Loki
      systemd:
        name: loki
        state: restarted
