# Add this to your existing Prometheus configuration
# This configures Prometheus to send alerts to Alertmanager

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093  # Alertmanager address

# Rule files - load alert rules from these files
rule_files:
  - /etc/prometheus/rules/*.yml
  # Or if using the gluon alerts file directly:
  # - /path/to/gluon.yml

